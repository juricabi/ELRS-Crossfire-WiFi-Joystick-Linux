# Every push and pull request (and called by release.yml, with the version to release):
#   native     unit tests with gcc and clang (ASan + UBSan, warnings are errors), then the program
#              end to end against fake modules (tests/e2e.py)
#   uinput     the virtual joystick through the kernel: packaging/install.sh sets up /dev/uinput for
#              real (udev rule, modules-load file), tests/uinput_e2e.py reads the joystick as a member
#              of the input group, then the systemd user service and --uninstall
#   static     the six static binaries (zig cc, musl): checked with file/readelf, every unit test
#              under qemu-user on the oldest CPU each one is for; the checked binaries uploaded as artifacts
#   web        the web page in headless Chromium (Playwright), against the program and the demo
#   core       core/ (shared with sticktime-pi) compiled and linked for Windows and macOS
#   scripts    shellcheck, the installer tests (tests/test_install.sh: sh, dash, bash --posix, busybox ash),
#              actionlint, Python syntax
# zig comes from its PyPI wheel (the Zig project's), checked against the pinned hash ZIG_SHA256.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Build exactly this version (release.yml, checked against VERSION); empty = a dev build"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.15.2
  # sha256 of ziglang-0.15.2-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl
  # (pypi.org/pypi/ziglang/0.15.2/json): the release binaries are built with it, so nothing unchecked
  ZIG_SHA256: 806316453d1ede7174ed3fefb8e5348154629089c3bb5fe812dfd0e172fac130
  # UBSan reports must fail the tests, not just print
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  ASAN_OPTIONS: detect_leaks=1

jobs:
  native:
    name: native tests (${{ matrix.cc }}, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: The sanitizer runtime (clang)
        if: matrix.cc == 'clang'
        run: |
          # -print-file-name answers the bare name when the file is not there
          if [ ! -f "$(clang -print-file-name=libclang_rt.asan-x86_64.a)" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          fi
      - name: Unit tests
        env:
          CC: ${{ matrix.cc }}
        run: SAN=1 WERROR=1 ./build.sh native test
      - name: End to end (the program against fake modules)
        run: python3 tests/e2e.py

  uinput:
    name: virtual joystick (uinput, udev rule, user service)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (ASan + UBSan)
        run: SAN=1 WERROR=1 ./build.sh native prog
      - name: Load uinput
        run: |
          if ! sudo modprobe uinput; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe uinput
          fi
          ls -l /dev/uinput
      - name: packaging/install.sh (as root; the udev rule applied at once)
        run: |
          udevadm verify --resolve-names=never packaging/60-elrs-wifi-joystick.rules
          sudo sh packaging/install.sh --file build/native/elrs-wifi-joystick
          cmp packaging/60-elrs-wifi-joystick.rules /etc/udev/rules.d/60-elrs-wifi-joystick.rules
          cmp packaging/elrs-wifi-joystick-uinput.conf /etc/modules-load.d/elrs-wifi-joystick-uinput.conf
          ls -l /dev/uinput
          test "$(stat -c '%G %a' /dev/uinput)" = "input 660"
          # a member of the input group can use it (the runner has no desktop seat for uaccess)
          sudo usermod -aG input "$(id -un)"
      - name: uinput end to end (as a member of the input group)
        # sudo -u: a fresh login of the same user, with the new group
        run: |
          sudo -u "$(id -un)" env "PATH=$PATH" "BIN=$PWD/build/native/elrs-wifi-joystick" \
            "UBSAN_OPTIONS=$UBSAN_OPTIONS" "ASAN_OPTIONS=$ASAN_OPTIONS" python3 tests/uinput_e2e.py --require
      - name: The systemd user service (install.sh --service), then --uninstall
        run: |
          uid=$(id -u)
          rt=/run/user/$uid
          # the user's systemd manager, started now and with the input group (no login on a runner)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl restart "user@$uid.service"
          for _ in $(seq 100); do [ -S "$rt/bus" ] && break; sleep 0.1; done
          sudo sh packaging/install.sh --file build/native/elrs-wifi-joystick --service
          export XDG_RUNTIME_DIR=$rt DBUS_SESSION_BUS_ADDRESS=unix:path=$rt/bus
          systemd-analyze verify /etc/systemd/user/elrs-wifi-joystick.service    # the unit's syntax
          systemctl --user is-enabled elrs-wifi-joystick.service
          for _ in $(seq 100); do curl -fsS http://127.0.0.1:11000/api/status > status.json && break; sleep 0.1; done
          python3 - <<'PY'
          import json
          s = json.load(open("status.json"))
          print("service:", s["status"], s["joystick"])
          assert s["running"] and s["listening"], s
          assert s["joystick"]["ok"] and s["joystick"]["device"].startswith("/dev/input/event"), s["joystick"]
          PY
          grep -q 'N: Name="ELRS Crossfire WiFi Joystick"' /proc/bus/input/devices
          systemctl --user --no-pager status elrs-wifi-joystick.service | tail -n 20 || true
          sudo sh packaging/install.sh --uninstall
          if systemctl --user is-active --quiet elrs-wifi-joystick.service; then echo "still running"; exit 1; fi
          for f in /usr/local/bin/elrs-wifi-joystick /etc/systemd/user/elrs-wifi-joystick.service \
                   /etc/udev/rules.d/60-elrs-wifi-joystick.rules /etc/modules-load.d/elrs-wifi-joystick-uinput.conf \
                   /usr/local/share/elrs-wifi-joystick "$HOME/.config/systemd/user/default.target.wants/elrs-wifi-joystick.service"; do
            if [ -e "$f" ] || [ -L "$f" ]; then echo "left behind: $f"; exit 1; fi
          done

  static:
    name: static ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # file: what file(1) must say; cpus: where the unit tests run ("native", or qemu-user:cpu, the
        # oldest CPU the target is for); arm: the ARM architecture readelf must report
        include:
          - { target: x86_64, file: "ELF 64-bit LSB executable, x86-64", cpus: "native qemu-x86_64-static:qemu64", arm: "" }
          - { target: i686, file: "ELF 32-bit LSB executable, Intel (80386|i386)", cpus: "native qemu-i386-static:pentium2", arm: "" }
          - { target: aarch64, file: "ELF 64-bit LSB executable, ARM aarch64", cpus: "qemu-aarch64-static:cortex-a53", arm: "" }
          - { target: armv7, file: "ELF 32-bit LSB executable, ARM, EABI5", cpus: "qemu-arm-static:cortex-a7 qemu-arm-static:cortex-a9,neon=off,vfp-d32=off", arm: "v7" }
          - { target: armv6, file: "ELF 32-bit LSB executable, ARM, EABI5", cpus: "qemu-arm-static:arm1176", arm: "v6" }
          # sifive-u54: RV64GC and nothing more (qemu's generic rv64 also runs Zba/Zbb/..., which boards
          # like the VisionFive 1 or the Allwinner D1 lack)
          - { target: riscv64, file: "ELF 64-bit LSB executable, UCB RISC-V, RVC, double-float ABI", cpus: "qemu-riscv64-static:sifive-u54", arm: "" }
    env:
      TARGET: ${{ matrix.target }}
      FILE_RE: ${{ matrix.file }}
      CPUS: ${{ matrix.cpus }}
      ARM_ARCH: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zig (checked against ZIG_SHA256) and qemu-user
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          printf 'ziglang==%s --hash=sha256:%s\n' "$ZIG_VERSION" "$ZIG_SHA256" > "$RUNNER_TEMP/zig.txt"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/zig.txt"
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qemu-user-static file binutils
      - name: Build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # a release builds exactly its version (release.yml checked it against VERSION, for a tag and for a
          # release run by hand); anything else is a dev build
          v=$(tr -d ' \r\n' < VERSION)
          if [ -n "$RELEASE_VERSION" ]; then v=$RELEASE_VERSION; else v="$v-dev.$(git rev-parse --short HEAD)"; fi
          echo "version $v"
          # the unit tests below build with the same flags: nothing is recompiled or relinked with another version
          { echo "VERSION=$v"; echo "WERROR=1"; } >> "$GITHUB_ENV"
          VERSION=$v WERROR=1 ./build.sh "$TARGET" all
      - name: Check the binary (static, no interpreter, the right architecture)
        run: |
          b=build/$TARGET/elrs-wifi-joystick
          file "$b"
          file "$b" | grep -Eq "$FILE_RE.*statically linked"
          if readelf -lW "$b" | grep -q INTERP; then echo "it asks for a dynamic loader"; exit 1; fi
          if [ -n "$ARM_ARCH" ]; then
            readelf -A "$b" | grep -E 'Tag_CPU_arch:|Tag_FP_arch|Tag_Advanced_SIMD|Tag_ABI_VFP_args'
            readelf -A "$b" | grep -Eq "Tag_CPU_arch: $ARM_ARCH\$"
            readelf -A "$b" | grep -q 'Tag_ABI_VFP_args: VFP registers'     # hard float, like armhf
          fi
          if [ "$TARGET" = aarch64 ]; then
            # kernels with 16 KiB (Pi 5) or 64 KiB pages load only segments aligned to that
            readelf -lW "$b" | awk '$1 == "LOAD" { print $NF }' | while read -r a; do
              [ $((a)) -ge 65536 ] || { echo "LOAD segment aligned to $a"; exit 1; }
            done
          fi
          # this file, as checked, is the artifact (whatever the steps below build)
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$b" "$RUNNER_TEMP/dist/elrs-wifi-joystick"
      - name: Unit tests
        run: |
          for c in $CPUS; do
            case $c in native) run="" ;; *) run="${c%%:*} -cpu ${c#*:}" ;; esac
            echo "::group::unit tests on ${run:-this machine}"
            RUN="$run" ./build.sh "$TARGET" test
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: elrs-wifi-joystick-linux-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/elrs-wifi-joystick
          if-no-files-found: error
          retention-days: 30

  web:
    name: web page (headless Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Playwright
        run: |
          python -m pip install --quiet playwright==1.64.0    # the version the tests are checked with
          python -m playwright install --with-deps chromium
      - name: Build the program
        run: WERROR=1 ./build.sh native prog
      - name: The page against the program (fake modules)
        run: python tests/test_ui.py --real
      - name: The page against the demo engine
        run: python tests/test_ui.py --demo

  core:
    name: core/ on Windows and macOS (zig cc)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install zig (checked against ZIG_SHA256)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          printf 'ziglang==%s --hash=sha256:%s\n' "$ZIG_VERSION" "$ZIG_SHA256" > "$RUNNER_TEMP/zig.txt"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/zig.txt"
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Compile core/*.c (-Wall -Wextra -Werror), link its tests
        run: |
          out=$RUNNER_TEMP/core
          mkdir -p "$out"
          for t in x86_64-windows-gnu aarch64-macos x86_64-macos; do
            echo "== $t"
            for f in core/*.c; do
              zig cc -target "$t" -std=gnu99 -Wall -Wextra -Werror -O2 -Icore -c "$f" -o "$out/$(basename "$f" .c)-$t.o"
            done
            # the tests too (with build.sh's -Wno-unused-parameter): every symbol they need is there
            net=""
            case $t in *windows*) net=-lws2_32 ;; esac
            zig cc -target "$t" -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -O2 -Icore \
              -o "$out/test_wifi_proto-$t" core/tests/test_wifi_proto.c core/wifi_proto.c
            zig cc -target "$t" -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -O2 -Icore \
              -o "$out/test_wifi_net-$t" core/tests/test_wifi_net.c core/wifi_net.c core/wifi_proto.c $net
          done
          file "$out"/test_*

  scripts:
    name: scripts (shellcheck, installer tests, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          python -m pip install --quiet shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25
          # busybox (not busybox-static): its sh runs the tools on PATH (the fakes), so busybox ash gets the
          # whole installer suite, not only the smoke test of a busybox built with standalone applets
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends busybox
      - name: shellcheck
        run: shellcheck --version && shellcheck build.sh packaging/install.sh tests/test_install.sh
      - name: The installer (fake root, fake GitHub; sh, dash, bash --posix, busybox ash, busybox tools)
        run: |
          out=$(BUSYBOX=/usr/bin/busybox sh tests/test_install.sh) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # busybox ash ran the whole suite (not the smoke test only)
          printf '%s\n' "$out" | grep -qx '== install.sh under /usr/bin/busybox sh'
      - name: actionlint
        run: actionlint -color
      - name: Python syntax
        run: python -m py_compile tests/*.py
